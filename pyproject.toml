[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-default"
version = "1.3.0"
description = "Credit card default risk scoring with modern tree ensembles and calibrated thresholds"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "shap>=0.44",
  "joblib>=1.3",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
credit-default-train = "credit_default.train:run_training"

[tool.setuptools.packages.find]
where = ["src"]
